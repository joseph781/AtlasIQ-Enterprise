<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtlasIQ SidePanel Copilot</title>
    <script src="js/theme-init.js"></script>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --border: #e2e8f0;
            --text: #0f172a;
            --sub: #64748b;
            --primary: #2563eb;
            --success: #10b981;
            --warn: #f59e0b;
        }
        [data-theme="dark"] {
            --bg: #0b0f19;
            --card: #111827;
            --border: #1e293b;
            --text: #f8fafc;
            --sub: #94a3b8;
            --primary: #3b82f6;
            --success: #10b981;
            --warn: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 100vh; }
        .top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
        .brand { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
        .brand span { color: var(--primary); }
        .tag { font-size: 10px; font-weight: 800; background: rgba(59,130,246,0.15); color: var(--primary); padding: 2px 7px; border-radius: 99px; }
        .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; }
        .kpi-lbl { font-size: 10px; color: var(--sub); font-weight: 700; text-transform: uppercase; }
        .kpi-val { font-size: 17px; font-weight: 800; margin-top: 2px; }
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .row { display: flex; gap: 6px; align-items: center; }
        select { flex: 1; height: 32px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 12px; padding: 0 8px; }
        .btn { height: 34px; border-radius: 7px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; color: #fff; text-decoration: none; padding: 0 10px; }
        .btn-blue { background: var(--primary); width: 100%; }
        .btn-green { background: var(--success); width: 100%; }
        .btn-red { background: #ef4444; width: 100%; display: none; }
        .chips { display: flex; gap: 5px; flex-wrap: wrap; }
        .chip { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--border); background: var(--card); color: var(--sub); cursor: pointer; }
        .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        .feed { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; flex: 1; }
        .lead-item { background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 9px 10px; display: flex; flex-direction: column; gap: 4px; }
        .lead-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
        .lead-name { font-size: 12.5px; font-weight: 800; line-height: 1.3; }
        .score-pill { font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 6px; background: rgba(16,185,129,0.15); color: var(--success); }
        .lead-meta { font-size: 11px; color: var(--sub); }
        .lead-badges { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px; }
        .mini-badge { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: rgba(245,158,11,0.15); color: var(--warn); }
        .lead-actions { display: flex; gap: 6px; margin-top: 4px; }
        .mini-btn { flex: 1; height: 25px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font-size: 10.5px; font-weight: 700; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; }
        .mini-btn.wa { background: rgba(16,185,129,0.15); color: var(--success); border-color: rgba(16,185,129,0.35); }
    </style>
</head>
<body>
    <div class="top">
        <div class="brand">🌐 Atlas<span>IQ</span> Copilot</div>
        <span class="tag">SidePanel v4.0</span>
    </div>

    <div class="kpis">
        <div class="kpi">
            <div class="kpi-lbl">Leads</div>
            <div class="kpi-val" id="sp-total">0</div>
        </div>
        <div class="kpi">
            <div class="kpi-lbl">Emails</div>
            <div class="kpi-val" id="sp-emails" style="color: var(--success);">0</div>
        </div>
        <div class="kpi">
            <div class="kpi-lbl">Score 75+</div>
            <div class="kpi-val" id="sp-hot" style="color: var(--warn);">0</div>
        </div>
    </div>

    <div class="panel">
        <div class="row">
            <select id="sp-grid">
                <option value="single">Barrido: Zona Actual</option>
                <option value="2x2">Barrido: Malla 2×2 (4 Zonas)</option>
                <option value="3x3">Barrido: Malla H3 3×3 (9 Zonas)</option>
                <option value="4x4">Barrido: Malla 4×4 (16 Zonas)</option>
            </select>
        </div>
        <button class="btn btn-blue" id="sp-btn-start">▶ Lanzar Extracción en Pestaña Activa</button>
        <button class="btn btn-red" id="sp-btn-stop">⏹ Detener Extracción</button>
        <button class="btn btn-green" id="sp-btn-crm">📊 Abrir CRM Ejecutivo Completo</button>
    </div>

    <div class="chips">
        <span class="chip active" data-flt="all">Todos</span>
        <span class="chip" data-flt="hot">🔥 Score 75+</span>
        <span class="chip" data-flt="noweb">⚡ Sin Web</span>
        <span class="chip" data-flt="unclaimed">🏴 Sin Reclamar</span>
    </div>

    <div class="feed" id="sp-feed"></div>

    <script src="js/util.js"></script>
    <script src="js/sidepanel.js"></script>
</body>
</html>
