<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtlasIQ Enterprise v4.0</title>
    <script src="js/theme-init.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }
        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --bg: #0b0f19;
            --card-bg: #111827;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --border: #1e293b;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 356px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
            padding: 13px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 7px; }
        .brand span { color: #60a5fa; }
        .badge { font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.18); color: #fff; padding: 2px 8px; border-radius: 99px; }
        .body { padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .stats-label { font-size: 10px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
        .stats-count { font-size: 19px; font-weight: 800; color: var(--primary); }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card-title { font-size: 10.5px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.3px; }
        .mode-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
            background: var(--bg);
            padding: 3px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .mode-tab {
            border: none;
            border-radius: 6px;
            padding: 6px 8px;
            font-size: 11.5px;
            font-weight: 800;
            cursor: pointer;
            background: transparent;
            color: var(--text-sub);
            transition: all 0.15s;
        }
        .mode-tab.active {
            background: var(--primary);
            color: #ffffff;
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        }
        .gps-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            padding: 6px 9px;
            border-radius: 7px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.35);
            font-size: 11px;
            font-weight: 700;
            color: var(--success);
        }
        .gps-refresh {
            border: none;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border-radius: 5px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
        }
        .input, .select {
            width: 100%;
            height: 35px;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0 10px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-main);
            background: var(--bg);
            outline: none;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .chip {
            font-size: 10.5px;
            font-weight: 700;
            background: var(--bg);
            color: var(--text-sub);
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
        }
        .chip:hover { border-color: var(--primary); color: var(--primary); }
        .auto-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
        }
        .btn {
            width: 100%;
            height: 36px;
            border: none;
            border-radius: 7px;
            font-size: 12.5px;
            font-weight: 800;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); }
        .btn-success { background: linear-gradient(135deg, #059669, #10b981); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .footer { padding: 0 14px 12px; text-align: center; font-size: 10.5px; color: var(--text-sub); }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">🌐 Atlas<span>IQ</span></div>
        <span class="badge">v4.0 EXTREME</span>
    </div>

    <div class="body">
        <div class="stats-card">
            <div>
                <div class="stats-label">Prospectos Activos</div>
                <div class="stats-count" id="stored-leads-count">0</div>
            </div>
            <div style="display:flex;gap:6px;">
                <button id="open-sidepanel-btn" class="btn btn-outline" style="width:auto;height:31px;padding:0 9px;font-size:11px;" title="Abrir Copilot lateral">
                    🧭 Copilot
                </button>
                <button id="open-crm-btn" class="btn btn-primary" style="width:auto;height:31px;padding:0 11px;font-size:11.5px;">
                    📊 CRM
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">1. Punto de Referencia para Scrapeo</div>
            <div class="mode-tabs">
                <button type="button" class="mode-tab active" id="mode-gps-btn">📍 1. Mi Ubicación</button>
                <button type="button" class="mode-tab" id="mode-city-btn">🌍 2. Otra Ciudad</button>
            </div>

            <div class="gps-strip" id="gps-status-strip">
                <span id="gps-status-text">📍 Detectando tu ubicación actual...</span>
                <button type="button" class="gps-refresh" id="btn-refresh-gps" title="Actualizar GPS exacto">↻ GPS</button>
            </div>

            <input type="text" id="query-input" class="input" placeholder="¿Qué buscas cerca de ti? Ej: Clínicas dentales" value="Clínicas dentales" />

            <div class="chips">
                <span class="chip" data-niche="Clínicas dentales">🦷 Clínicas</span>
                <span class="chip" data-niche="Restaurantes">🍽 Restaurantes</span>
                <span class="chip" data-niche="Inmobiliarias">🏢 Inmobiliarias</span>
                <span class="chip" data-niche="Gimnasios">🏋️ Gimnasios</span>
            </div>

            <select id="popup-grid-select" class="select">
                <option value="single" data-zoom="15" selected>📍 Zona Inmediata (~2 km · Estándar)</option>
                <option value="2x2" data-zoom="14">🧭 Radio Urbano (~5 km · Malla 2×2)</option>
                <option value="3x3" data-zoom="13">🌐 Radio Ciudad (~10 km · Malla H3 3×3)</option>
                <option value="4x4" data-zoom="13">🚀 Radio Metropolitano (~16 km · Malla 4×4)</option>
            </select>

            <label class="auto-row">
                <input type="checkbox" id="popup-autostart" checked />
                <span>⚡ Iniciar scrapeo automático al abrir el mapa</span>
            </label>

            <button id="search-btn" class="btn btn-success">📍 Escanear desde Mi Ubicación Actual</button>
        </div>

        <div class="stats-card" id="popup-license-card">
            <div>
                <div class="stats-label">Seguridad ECDSA P-256</div>
                <div id="popup-license-status" style="font-size: 12px; font-weight: 800; color: var(--text-sub);">Verificando...</div>
            </div>
            <button id="btn-popup-license-open" class="btn btn-outline" style="width: auto; height: 28px; padding: 0 10px; font-size: 11px;">
                Gestionar
            </button>
        </div>
    </div>

    <div class="footer">
        <a href="index.html" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 700;">📖 Manual Oficial</a> ·
        <strong>Joseph Castillo (CEO)</strong> · <strong>WINDOWSTELECOM</strong>
    </div>

    <script src="js/util.js"></script>
    <script src="js/license.js"></script>
    <script src="js/popup.js"></script>
</body>
</html>
