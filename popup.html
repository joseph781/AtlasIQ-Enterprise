<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AtlasIQ Enterprise v4.0</title>
    <script src="js/theme-init.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
        }
        [data-theme="dark"] {
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --bg: #0b0f19;
            --card-bg: #111827;
            --text-main: #f8fafc;
            --text-sub: #cbd5e1;
            --border: #1e293b;
            --success: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 340px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-main);
        }
        .header {
            background: linear-gradient(135deg, #0f172a 0%, #1d4ed8 100%);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .brand { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 7px; }
        .brand span { color: #60a5fa; }
        .badge { font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.18); color: #fff; padding: 2px 8px; border-radius: 99px; }
        .body { padding: 14px; display: flex; flex-direction: column; gap: 11px; }
        .stats-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 11px 13px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .stats-label { font-size: 10.5px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
        .stats-count { font-size: 20px; font-weight: 800; color: var(--primary); }
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 13px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }
        .card-title { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; }
        .input {
            width: 100%;
            height: 36px;
            border: 1px solid var(--border);
            border-radius: 7px;
            padding: 0 10px;
            font-size: 13px;
            color: var(--text-main);
            background: var(--bg);
            outline: none;
        }
        .chips { display: flex; flex-wrap: wrap; gap: 5px; }
        .chip {
            font-size: 11px;
            font-weight: 600;
            background: var(--bg);
            color: var(--text-sub);
            padding: 3px 8px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
        }
        .btn {
            width: 100%;
            height: 35px;
            border: none;
            border-radius: 7px;
            font-size: 12.5px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }
        .btn-primary { background: var(--primary); }
        .btn-success { background: var(--success); }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
        .footer { padding: 0 14px 13px; text-align: center; font-size: 11px; color: var(--text-sub); }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand">🌐 Atlas<span>IQ</span></div>
        <span class="badge">v4.0 EXTREME</span>
    </div>

    <div class="body">
        <div class="stats-card">
            <div>
                <div class="stats-label">Prospectos Activos</div>
                <div class="stats-count" id="stored-leads-count">0</div>
            </div>
            <div style="display:flex;gap:6px;">
                <button id="open-sidepanel-btn" class="btn btn-outline" style="width:auto;height:32px;padding:0 10px;font-size:11.5px;" title="Abrir Copilot lateral">
                    🧭 Copilot
                </button>
                <button id="open-crm-btn" class="btn btn-primary" style="width:auto;height:32px;padding:0 12px;font-size:12px;">
                    📊 CRM
                </button>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🔍 Lanzador de Misión en Google Maps</div>
            <input type="text" id="query-input" class="input" placeholder="Ej: Clínicas dentales en Madrid" value="Clínicas dentales en Madrid" />
            <div class="chips">
                <span class="chip" data-query="Clínicas Dentales en ">🦷 Clínicas</span>
                <span class="chip" data-query="Restaurantes en ">🍽 Restaurantes</span>
                <span class="chip" data-query="Inmobiliarias en ">🏢 Inmobiliarias</span>
                <span class="chip" data-query="Gimnasios en ">🏋️ Gimnasios</span>
            </div>
            <button id="search-btn" class="btn btn-success">▶ Lanzar Deep Harvester en Maps</button>
        </div>

        <div class="stats-card" id="popup-license-card">
            <div>
                <div class="stats-label">Seguridad ECDSA P-256</div>
                <div id="popup-license-status" style="font-size: 12px; font-weight: 800; color: var(--text-sub);">Verificando...</div>
            </div>
            <button id="btn-popup-license-open" class="btn btn-outline" style="width: auto; height: 28px; padding: 0 10px; font-size: 11px;">
                Gestionar
            </button>
        </div>
    </div>

    <div class="footer">
        <a href="index.html" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 700;">📖 Manual Oficial</a> ·
        <strong>Joseph Castillo (CEO)</strong> · <strong>WINDOWSTELECOM</strong>
    </div>

    <script src="js/license.js"></script>
    <script src="js/popup.js"></script>
</body>
</html>
