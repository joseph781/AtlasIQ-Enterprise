<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WINDOWSTELECOM – Generador Maestro de Licencias AtlasIQ</title>
    <style>
        :root {
            --bg: #090d16;
            --card-bg: #111827;
            --card-border: #1f2937;
            --accent: #2563eb;
            --accent-glow: rgba(37, 99, 235, 0.4);
            --text-main: #f9fafb;
            --text-sub: #9ca3af;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .keygen-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .badge {
            display: inline-block;
            background: rgba(37, 99, 235, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(37, 99, 235, 0.3);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #d1d5db;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            color: #fff;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .btn-generate {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
            transition: all 0.2s;
            margin-top: 10px;
        }

        .btn-generate:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.6);
        }

        /* Result Section */
        .result-box {
            display: none;
            margin-top: 28px;
            padding-top: 24px;
            border-top: 1px solid var(--card-border);
        }

        .key-display {
            background: #0d131f;
            border: 1px solid #2563eb;
            border-radius: 8px;
            padding: 14px;
            font-family: monospace;
            font-size: 12px;
            color: #38bdf8;
            word-break: break-all;
            user-select: all;
            margin-bottom: 12px;
        }

        .wa-box {
            background: #1f2937;
            border-radius: 8px;
            padding: 12px;
            font-size: 12px;
            color: #e5e7eb;
            white-space: pre-wrap;
            line-height: 1.5;
            margin-bottom: 14px;
            max-height: 140px;
            overflow-y: auto;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-copy {
            background: #374151;
            color: #fff;
        }
        .btn-copy:hover { background: #4b5563; }

        .btn-wa {
            background: #059669;
            color: #fff;
        }
        .btn-wa:hover { background: #10b981; }

        .footer-note {
            text-align: center;
            font-size: 11px;
            color: #6b7280;
            margin-top: 24px;
        }
    </style>
</head>

<body>
    <div class="keygen-card">
        <div class="header">
            <span class="badge">Uso Exclusivo Administrador</span>
            <h1>Generador de Licencias AtlasIQ</h1>
            <p class="subtitle">WINDOWSTELECOM · Creado por Joseph Castillo (CEO)</p>
        </div>

        <div class="form-group">
            <label for="dev-id">ID de Dispositivo del Cliente:</label>
            <input type="text" id="dev-id" placeholder="Ej: ATQ-DEV-7F82-93A1-C4E2" autocomplete="off" />
            <small style="color: #6b7280; font-size: 11px; margin-top: 4px; display: block;">
                El código que el cliente te envió desde su navegador.
            </small>
        </div>

        <div class="form-group">
            <label for="client-name">Nombre del Cliente / Empresa:</label>
            <input type="text" id="client-name" placeholder="Ej: Distribuidora Los Andes C.A." />
        </div>

        <div class="form-group">
            <label for="validity">Vigencia de la Licencia:</label>
            <select id="validity">
                <option value="30">30 Días (Demostración / Piloto)</option>
                <option value="90">90 Días (Trimestral)</option>
                <option value="365" selected>365 Días (1 Año Completo - Estándar)</option>
                <option value="730">730 Días (2 Años)</option>
                <option value="3650">3650 Días (Licencia Vitalicia / 10 Años)</option>
            </select>
        </div>

        <button class="btn-generate" id="btn-generate">
            ✨ Generar Clave de Licencia Anual
        </button>

        <!-- OUTPUT RESULT -->
        <div class="result-box" id="result-box">
            <label>Clave de Activación Criptográfica:</label>
            <div class="key-display" id="key-output"></div>

            <label>Mensaje para WhatsApp:</label>
            <div class="wa-box" id="wa-text-output"></div>

            <div class="action-row">
                <button class="btn-action btn-copy" id="btn-copy-key">📋 Copiar Clave</button>
                <button class="btn-action btn-copy" id="btn-copy-msg">📋 Copiar Mensaje</button>
                <a href="#" target="_blank" class="btn-action btn-wa" id="btn-open-wa">💬 Enviar WhatsApp</a>
            </div>
        </div>

        <div class="footer-note">
            Algoritmo Criptográfico HMAC-SHA256 con Salt Secreta WINDOWSTELECOM. Las claves son intransferibles a otras PCs.
        </div>
    </div>

    <script>
        const MASTER_SECRET = "WINDOWSTELECOM_ATLASIQ_ENTERPRISE_SECRET_KEY_2026_98741_SECURE";

        function b64UrlEncode(str) {
            return btoa(unescape(encodeURIComponent(str)))
                .replace(/\+/g, "-")
                .replace(/\//g, "_")
                .replace(/=+$/, "");
        }

        async function computeHmacHex(payloadString, secretKey) {
            const encoder = new TextEncoder();
            const keyData = encoder.encode(secretKey);
            const messageData = encoder.encode(payloadString);

            const cryptoKey = await crypto.subtle.importKey(
                "raw",
                keyData,
                { name: "HMAC", hash: "SHA-256" },
                false,
                ["sign"]
            );

            const signature = await crypto.subtle.sign("HMAC", cryptoKey, messageData);
            const hashArray = Array.from(new Uint8Array(signature));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("").substring(0, 32).toUpperCase();
        }

        async function createLicense(deviceId, clientName, daysValid) {
            const issuedAt = Date.now();
            const expiresAt = issuedAt + (daysValid * 24 * 60 * 60 * 1000);

            const payload = {
                devId: deviceId.trim().toUpperCase(),
                name: (clientName.trim() || "Cliente AtlasIQ"),
                iat: issuedAt,
                exp: expiresAt,
                type: daysValid >= 365 ? "ANUAL_ENTERPRISE" : "PROMO_ENTERPRISE",
                issuer: "WINDOWSTELECOM"
            };

            const payloadStr = JSON.stringify(payload);
            const encodedPayload = b64UrlEncode(payloadStr);
            const signature = await computeHmacHex(encodedPayload, MASTER_SECRET);

            return {
                key: `ATQ-LIC-${encodedPayload}-${signature}`,
                expiresDate: new Date(expiresAt).toLocaleDateString("es-ES", { year: "numeric", month: "long", day: "numeric" }),
                days: daysValid,
                client: payload.name,
                devId: payload.devId
            };
        }

        document.getElementById("btn-generate").addEventListener("click", async () => {
            const devId = document.getElementById("dev-id").value.trim();
            const clientName = document.getElementById("client-name").value.trim();
            const days = parseInt(document.getElementById("validity").value) || 365;

            if (!devId) {
                alert("Por favor introduce el ID de Dispositivo del cliente.");
                return;
            }

            const lic = await createLicense(devId, clientName, days);

            document.getElementById("key-output").textContent = lic.key;

            const waMsg = `¡Hola ${lic.client}! 🚀\n\nTu licencia de *AtlasIQ Enterprise v2.5* ha sido activada con éxito.\n\n` +
                          `🛡️ *Equipo Vinculado:* ${lic.devId}\n` +
                          `📅 *Vigencia:* ${lic.days} días (Válida hasta el ${lic.expiresDate})\n\n` +
                          `🔑 *Tu Clave de Activación:* \n\`\`\`${lic.key}\`\`\`\n\n` +
                          `*Instrucciones de Activación:*\n` +
                          `1. Abre AtlasIQ CRM o el icono de la extensión.\n` +
                          `2. Pega tu clave de activación y haz clic en *Activar Licencia*.\n\n` +
                          `Gracias por confiar en *WINDOWSTELECOM*. ¡Éxito en tus ventas!`;

            document.getElementById("wa-text-output").textContent = waMsg;
            document.getElementById("result-box").style.display = "block";

            // Copy Key Button
            document.getElementById("btn-copy-key").onclick = () => {
                navigator.clipboard.writeText(lic.key).then(() => {
                    const btn = document.getElementById("btn-copy-key");
                    btn.textContent = "✅ ¡Clave Copiada!";
                    setTimeout(() => { btn.textContent = "📋 Copiar Clave"; }, 2000);
                });
            };

            // Copy Message Button
            document.getElementById("btn-copy-msg").onclick = () => {
                navigator.clipboard.writeText(waMsg).then(() => {
                    const btn = document.getElementById("btn-copy-msg");
                    btn.textContent = "✅ ¡Mensaje Copiado!";
                    setTimeout(() => { btn.textContent = "📋 Copiar Mensaje"; }, 2000);
                });
            };

            // WhatsApp link
            document.getElementById("btn-open-wa").href = `https://wa.me/?text=${encodeURIComponent(waMsg)}`;
        });
    </script>
</body>

</html>
